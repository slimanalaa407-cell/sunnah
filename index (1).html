<style>
:root{--bg:#f1f7f6;--card:#fff;--ink:#16221c;--mute:#667a70;--g:#2a9a4b;--gd:#1f6b3d;--gold:#b8935a;--line:#dde8e3;--gold2:#f3ead9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}

html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px 0}
.top{max-width:620px;margin:0 auto}
.top h1{font-size:1.3rem;margin:0 0 4px;font-weight:700}
nav{display:flex;gap:18px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 2px;color:var(--ink);font:600 .95rem Cairo,sans-serif;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--g);border-color:var(--g)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:22px 16px 40px}
.card{position:relative;background:var(--card);border:1.5px solid var(--gold);border-radius:20px;padding:70px 18px 18px;margin-top:34px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.badge{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:86%;max-width:420px;background:var(--gd);color:#fff;border:3px solid var(--card);outline:2px solid var(--gold);border-radius:44px;padding:12px 24px;text-align:center;font-family:Amiri,serif;font-size:1.05rem;line-height:1.8}
.bm{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--gold2);color:var(--gold);font-size:1.2rem;cursor:pointer}
.bm.on{background:var(--gold);color:#fff}
.bab{text-align:center;color:var(--gold);font-weight:700;font-size:.9rem;margin-top:8px}
.text{font-family:Amiri,serif;font-size:1.7rem;line-height:2;text-align:center;font-weight:700;min-height:140px;display:flex;align-items:center;justify-content:center;padding:6px 4px}
.src{text-align:center;color:var(--mute);font-size:.85rem;margin-bottom:6px}
.listen{display:block;margin:0 auto 14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:5px 16px;font:600 .9rem Cairo,sans-serif;cursor:pointer}
.acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.done{flex:1 1 150px;background:var(--g);color:#fff;border:0;border-radius:30px;padding:12px;font:700 1.05rem Cairo,sans-serif;cursor:pointer}
.done.off{background:var(--gd)}
.streak{text-align:center;font-weight:700;line-height:1.3}
.streak b{font-size:1.6rem}
.apply{flex:1 1 170px;border:2px solid var(--g);background:var(--gd);background-clip:content-box;color:#fff;border-radius:14px;padding:6px;font:700 .9rem Cairo,sans-serif;cursor:pointer}
.apply.on{background:var(--g);background-clip:content-box}
.week{background:var(--card);border-radius:16px;padding:18px;margin-top:26px;border:1px solid var(--line)}
.week h2{margin:0 0 10px;font-size:1.1rem}
.bar{height:34px;background:var(--line);border-radius:8px;overflow:hidden;position:relative;display:flex}
.fill{background:var(--g);height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#fff;font-weight:600;font-size:.85rem;white-space:nowrap;min-width:0;overflow:hidden}
.days{display:flex;justify-content:space-between;margin-top:10px;text-align:center;font-size:.8rem}
.days span{flex:1}
.days i{display:block;color:var(--g);font-style:normal;min-height:1.4em}
h3{margin:20px 0 6px;font-size:1rem;color:var(--gold)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item .t{flex:1;font-family:Amiri,serif;font-size:1.15rem;line-height:1.8}
.item small{display:block;color:var(--mute);font-family:Cairo,sans-serif;font-size:.8rem}
.item button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--ink)}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:1.5rem;color:var(--g)}
.reset{background:none;border:1px solid #c0392b;color:#c0392b;border-radius:10px;padding:10px 16px;font:600 .95rem Cairo,sans-serif;cursor:pointer}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding-bottom:16px}
[hidden]{display:none!important}
</style>

</div>
</div>

</div>
</section>

</div>
<h3>مراجعة كل اللي فات</h3>
<button class="listen" id="playAll">🔊 سمع الكل</button>
<div id="past"></div>
</section>

<section id="acc" hidden>
<div class="week" style="margin-top:0">
<h2>حسابي</h2>
<p>بدأتي الرحلة يوم: <b id="startDate"></b></p>
<button class="reset" id="reset">ابدأ من الأول</button>
</div>
</section>
</main>

["سنة الفجر","الاضطجاع على الشق الأيمن بعد ركعتي الفجر في البيت.","رواه البخاري"],
["الجلوس بعد الصلاة","الجلوس في المصلى بعد صلاة الفجر حتى تطلع الشمس.","رواه مسلم"],
["سنن الصلاة القولية","دعاء الاستفتاح: «سبحانك اللهم وبحمدك وتبارك اسمك وتعالى جدك ولا إله غيرك».","رواه الأربعة"],
["سنن الصلاة القولية","دعاء استفتاح آخر: «اللهم باعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب، اللهم نقني من خطاياي كما ينقى الثوب الأبيض من الدنس، اللهم اغسلني من خطاياي بالثلج والماء والبرد».","رواه البخاري ومسلم"],
["سنن الصلاة القولية","التعوذ قبل القراءة: «أعوذ بالله من الشيطان الرجيم».",""],
["سنن الصلاة القولية","البسملة: «بسم الله الرحمن الرحيم».",""],
["سنن الصلاة القولية","قول «آمين» بعد الفاتحة.",""],
["سنن الصلاة القولية","قراءة سورة بعد الفاتحة في الأوليين من الفجر والجمعة والمغرب والرباعية، والتطوع كله للمنفرد. أما المأموم فيقرأ في الصلاة السرية دون الجهرية.",""],
["سنن الصلاة القولية","بعد الرفع من الركوع وقول «ربنا ولك الحمد»: «ملء السموات وملء الأرض وما بينهما، وملء ما شئت من شيء بعد، أهل الثناء والمجد، أحق ما قال العبد، وكلنا لك عبد، اللهم لا مانع لما أعطيت ولا معطي لما منعت ولا ينفع ذا الجد منك الجد».","رواه مسلم"],
["سنن الصلاة القولية","الزيادة على المرة الواحدة في تسبيح الركوع والسجود.",""],
["سنن الصلاة القولية","الزيادة على مرة في قول «رب اغفر لي» بين السجدتين.",""],
["سنن الصلاة القولية","الدعاء بعد التشهد الأخير: «اللهم إني أعوذ بك من عذاب جهنم ومن عذاب القبر ومن فتنة المحيا والممات ومن فتنة المسيح الدجال».","رواه البخاري ومسلم"],
["سنن الصلاة القولية","الإكثار من الدعاء في السجود: «أقرب ما يكون العبد من ربه وهو ساجد فأكثروا فيه من الدعاء».","رواه مسلم"],
["سنن الصلاة الفعلية","رفع اليدين مع تكبيرة الإحرام.",""],
["سنن الصلاة الفعلية","رفع اليدين عند الركوع، وعند الرفع من الركوع.",""],
["سنن الصلاة الفعلية","رفع اليدين عند القيام للركعة الثالثة في الصلاة التي فيها تشهدان.",""],
["سنن الصلاة الفعلية","أن تكون الأصابع عند الرفع مضمومة ممدودة، مستقبلة القبلة بباطن الكف، وترفع إلى حذو المنكبين أو فروع الأذنين.",""],
["سنن الصلاة الفعلية","وضع اليد اليمنى على الشمال، أو قبض اليمنى على كوع رسغ الشمال.",""],
["سنن الصلاة الفعلية","النظر إلى موضع السجود.",""],
["سنن الصلاة الفعلية","التفريق بين القدمين قائمًا تفريقًا يسيرًا.",""],
["سنن الصلاة الفعلية","ترتيل القرآن وتدبر القراءة.",""],
["السنن التي تفعل في الركوع","قبض الركبتين باليدين مفرجتي الأصابع.",""],
["السنن التي تفعل في الركوع","مد الظهر مستويًا في الركوع.",""],
["السنن التي تفعل في الركوع","جعل الرأس حيال الظهر، فلا يخفضه ولا يرفعه.",""],
["السنن التي تفعل في الركوع","مجافاة العضدين عن الجنبين.",""],
["السنن التي تفعل في السجود","مجافاة العضدين عن الجنبين، والبطن عن الفخذين، والفخذين عن الساقين.",""],
["السنن التي تفعل في السجود","التفريق بين الركبتين في السجود.",""],
["السنن التي تفعل في السجود","إقامة القدمين، وجعل بطون أصابعهما على الأرض، وأن تكونا مرصوصتين أثناء السجود.",""],
["السنن التي تفعل في السجود","وضع اليدين حذو المنكبين أو الأذنين، مبسوطتين مضمومتي الأصابع، مستقبلًا بهما القبلة.",""],
["السنن التي تفعل في السجود","الجلوس بين السجدتين بالافتراش: ينصب اليمنى ويفترش اليسرى، أو بالإقعاء: ينصب القدمين ويجلس على العقبين.",""],
["السنن اللتي تفعل في السجود","الإشارة بالسبابة عند التشهد من أوله إلى آخره.",""],
["السنن اللتي تفعل في السجود","الالتفات عن اليمين والشمال في التسليمتين.",""],
 ["السنن اللتي تفعل في السجود","جلسه الأستراحه : هي جلسه يسيره لا ذكر فيها و مكانها بعد السجده الثانيه من الركعه الأولي و الركعه الثالثه .",""],
["سنن بعد الصلاة","الاستغفار ثلاثًا، ثم: «اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام».","رواه مسلم"],
["سنن بعد الصلاة","«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت ولا معطي لما منعت ولا ينفع ذا الجد منك الجد».","رواه البخاري ومسلم"],
["سنن بعد الصلاة","«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، لا حول ولا قوة إلا بالله، لا إله إلا الله ولا نعبد إلا إياه، له النعمة وله الفضل وله الثناء الحسن، لا إله إلا الله مخلصين له الدين ولو كره الكافرون».","رواه مسلم"],
["سنن بعد الصلاة","«سبحان الله» ثلاثًا وثلاثين، «والحمد لله» ثلاثًا وثلاثين، «والله أكبر» ثلاثًا وثلاثين، ثم: «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير».","رواه مسلم"],
["سنن بعد الصلاة","«اللهم أعني على ذكرك وشكرك وحسن عبادتك».","رواه أبو داود والنسائي"],
["سنن بعد الصلاة","«اللهم إني أعوذ بك من الجبن، وأعوذ بك أن أرد إلى أرذل العمر، وأعوذ بك من فتنة الدنيا، وأعوذ بك من عذاب القبر».","رواه البخاري"],
["سنن بعد الصلاة","«رب قني عذابك يوم تبعث عبادك».","رواه مسلم"],
["سنن بعد الصلاة","قراءة «قل هو الله أحد» و«قل أعوذ برب الفلق» و«قل أعوذ برب الناس»، وبعد الفجر والمغرب تكررها ثلاثًا.","رواه أبو داود والترمذي والنسائي"],
["سنن بعد الصلاة","قراءة آية الكرسي بعد كل صلاة.","رواه النسائي"],
["سنن بعد الصلاة","«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد يحيي ويميت وهو على كل شيء قدير» عشر مرات بعد المغرب والصبح.","رواه الترمذي"],
["سنن بعد الصلاة","أن يقول هذه الأذكار وهو في مصلاه الذي صلى فيه، ولا يغير مكانه.",""],
["سنن بعد الصلاة","أن يكون هذا التسبيح باليدين .",""],
["سنن تقال في الصباح و المساء","آية الكرسي: من قالها حين يصبح أجير من الجن حتى يمسي، ومن قالها حين يمسي أجير منهم حتى يصبح.","رواه النسائي"],
["سنن تقال في الصباح و المساء","«قل هو الله أحد» والمعوذتان ثلاث مرات حين يصبح وحين يمسي، تكفيه من كل شيء.","رواه أبو داود والترمذي"],
["سنن تقال في الصباح و المساء","«أصبحنا وأصبح الملك لله والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذا اليوم وخير ما بعده، وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب النار وعذاب القبر». وفي المساء تقول «أمسينا وأمسى الملك لله».","رواه مسلم"],
["سنن تقال في الصباح و المساء","«اللهم بك أصبحنا وبك أمسينا، وبك نحيا وبك نموت وإليك النشور». وفي المساء: «اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير».","رواه الترمذي"],
["سنن تقال في الصباح و المساء","«اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت».","رواه البخاري"],
["سنن تقال في الصباح و المساء","«اللهم إني أصبحت أشهدك وأشهد حملة عرشك وملائكتك وجميع خلقك أنك أنت الله لا إله إلا أنت وحدك لا شريك لك وأن محمدًا عبدك ورسولك» أربع مرات.","رواه أبو داود والنسائي"],
["سنن تقال في الصباح و المساء","«اللهم ما أصبح بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك، فلك الحمد ولك الشكر».","رواه أبو داود والنسائي"],
["سنن تقال في الصباح و المساء","«اللهم عافني في بدني، اللهم عافني في سمعي، اللهم عافني في بصري، لا إله إلا أنت. اللهم إني أعوذ بك من الكفر والفقر، وأعوذ بك من عذاب القبر، لا إله إلا أنت» ثلاث مرات.","رواه أبو داود وأحمد"],
["سنن تقال في الصباح و المساء","«حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم» سبع مرات.","أخرجه ابن السني وأبو داود"],
["سنن تقال في الصباح و المساء","«اللهم إني أسألك العفو والعافية في ديني ودنياي وأهلي ومالي، اللهم استر عوراتي وآمن روعاتي، اللهم احفظني من بين يدي ومن خلفي وعن يميني وعن شمالي ومن فوقي، وأعوذ بعظمتك أن أغتال من تحتي».","رواه أبو داود وابن ماجه"],
["سنن تقال في الصباح و المساء","«اللهم عالم الغيب والشهادة فاطر السماوات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءًا أو أجره إلى مسلم».","رواه الترمذي وأبو داود"],
["سنن تقال في الصباح و المساء","«بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم» ثلاث مرات.","رواه أبو داود والترمذي وابن ماجه وأحمد"],
["سنن تقال في الصباح و المساء","«رضيت بالله ربًا وبالإسلام دينًا وبمحمد ﷺ نبيًا» ثلاث مرات.","رواه أبو داود والترمذي والنسائي وأحمد"],
["سنن تقال في الصباح و المساء","«يا حي يا قيوم برحمتك أستغيث، أصلح لي شأني كله ولا تكلني إلى نفسي طرفة عين».","رواه الحاكم"],
["سنن تقال في الصباح و المساء","«أصبحنا على فطرة الإسلام وكلمة الإخلاص ودين نبينا محمد وملة أبينا إبراهيم حنيفًا مسلمًا وما كان من المشركين».","رواه أحمد"],
["سنن تقال في الصباح و المساء","«سبحان الله وبحمده» مائة مرة.","رواه مسلم"],
["سنن تقال في الصباح و المساء","«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير» مائة مرة.","رواه البخاري ومسلم"],
["سنن تقال في الصباح و المساء","«أستغفر الله وأتوب إليه» مائة مرة في اليوم.","رواه البخاري ومسلم"],
["سنن تقال في الصباح و المساء","«اللهم إني أسألك علمًا نافعًا ورزقًا طيبًا وعملًا متقبلًا» إذا أصبح.","رواه ابن ماجه"],
["سنن تقال في الصباح و المساء","«سبحان الله وبحمده، عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته» ثلاث مرات.","رواه مسلم"],
["سنن تقال في الصباح و المساء","«أعوذ بكلمات الله التامات من شر ما خلق» ثلاث مرات إذا أمسى.","رواه الترمذي وابن ماجه وأحمد"],
["سنن عند لقاء الناس","إلقاء السلام على من عرفت ومن لم تعرف.","رواه البخاري ومسلم"],
["سنن عند لقاء الناس","إكمال السلام: «السلام عليكم ورحمة الله وبركاته» (ثلاثون حسنة).","رواه أبو داود وحسنه الترمذي"],
["سنن عند لقاء الناس","السلام عند الدخول على المجلس وعند مفارقته: «فليست الأولى بأحق من الآخرة».","رواه أبو داود والترمذي"],
["سنن عند لقاء الناس","الابتسامة: «لا تحقرن من المعروف شيئًا ولو أن تلقى أخاك بوجه طلق».","رواه مسلم"],
["سنن عند لقاء الناس","المصافحة: «ما من مسلمين يلتقيان فيتصافحان إلا غفر لهما قبل أن يتفرقا».","رواه أبو داود والترمذي وابن ماجه"],
["سنن عند لقاء الناس","الكلمة الطيبة: «والكلمة الطيبة صدقة».","رواه البخاري ومسلم"],
["سنن الطعام","التسمية قبل الطعام، والأكل باليمين، والأكل مما يليك: «يا غلام سم الله وكل بيمينك وكل مما يليك».","رواه مسلم"],
["سنن الطعام","إذا سقطت اللقمة فليمط ما بها من أذى ثم يأكلها.","رواه مسلم"],
["سنن الطعام","الأكل بثلاث أصابع.","رواه مسلم"],
["سنن الطعام","الجلوس عند الأكل: جاثيًا على ركبتيه وظهور قدميه، أو ينصب الرجل اليمنى ويجلس على اليسرى.",""],
["سنن الطعام","لعق القصعة والأصابع: «إنكم لا تدرون في أيها البركة».","رواه مسلم"],
["سنن الطعام","الحمد لله بعد الأكل: «الحمد لله الذي أطعمني هذا ورزقنيه من غير حول مني ولا قوة».","رواه أبو داود والترمذي وابن ماجه"],
["سنن عند الشراب","التسمية والشرب باليد اليمنى.","رواه مسلم"],
["سنن عند الشراب","التنفس ثلاثًا أثناء الشرب خارج الإناء.","رواه مسلم"],
["سنن عند الشراب","الشرب جالسًا: «لا يشربن أحدكم قائمًا».","رواه مسلم"],
["سنن عند الشراب","قول «الحمد لله» بعد الشرب.","رواه مسلم"],
["أداء النوافل في البيت","قال ﷺ :ان خير صلاه المرء في بيته الا الصلاه المكتوبه .","متفق عليه"],
["أداء النوافل في البيت","قال ﷺ : صلاه الرجل تطوعا حيث لا يراه الناس تعدل صلاته علي أعين الناس خمسا و عشرين.","رواه أبو يعلي و صححه الألباني"],
["أداء النوافل في البيت","قال ﷺ :فضل صلاه الفجر في بيته علي صلاته حيث يراه الناس كفضل المكتوبه علي النافله.","رواه الطبراني و حسنه الألباني"],
["السنة عند القيام من المجلس","كفارة المجلس: «سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت، أستغفرك وأتوب إليك».","رواه أصحاب السنن"],
["سنن قبل النوم","«باسمك اللهم أموت وأحيا».","رواه البخاري"],
["سنن قبل النوم","جمع الكفين والنفث فيهما بقراءة «قل هو الله أحد» والمعوذتين، ثم المسح بهما على الجسد يبدأ برأسه ووجهه، ثلاث مرات.","رواه البخاري"],
["سنن قبل النوم","قراءة آية الكرسي: لا يزال عليك من الله حافظ ولا يقربك شيطان.","رواه البخاري"],
["سنن قبل النوم","«باسمك ربي وضعت جنبي وبك أرفعه، إن أمسكت نفسي فارحمها وإن أرسلتها فاحفظها بما تحفظ به عبادك الصالحين».","رواه البخاري ومسلم"],
["سنن قبل النوم","«اللهم إنك خلقت نفسي وأنت توفاها، لك مماتها ومحياها، إن أحييتها فاحفظها، وإن أمتها فاغفر لها، اللهم إني أسألك العافية».","رواه مسلم"],
["سنن قبل النوم","«اللهم قني عذابك يوم تبعث عبادك» ثلاث مرات، ويضع يده اليمنى تحت خده.","رواه أبو داود والترمذي"],
["سنن قبل النوم","التسبيح ثلاثًا وثلاثين، والتحميد ثلاثًا وثلاثين، والتكبير أربعًا وثلاثين.","رواه البخاري ومسلم"],
["سنن قبل النوم","«الحمد لله الذي أطعمنا وسقانا وكفانا وآوانا، فكم ممن لا كافي له ولا مأوى».","رواه مسلم"],
["سنن قبل النوم","«اللهم عالم الغيب والشهادة فاطر السماوات والأرض، رب كل شيء ومليكه، أشهد أن لا إله إلا أنت، أعوذ بك من شر نفسي ومن شر الشيطان وشركه، وأن أقترف على نفسي سوءًا أو أجره إلى مسلم».","رواه أبو داود والترمذي"],
["سنن قبل النوم","«اللهم أسلمت نفسي إليك، وفوضت أمري إليك، ووجهت وجهي إليك، وألجأت ظهري إليك، رغبة ورهبة إليك، لا ملجأ ولا منجا إلا إليك، آمنت بكتابك الذي أنزلت وبنبيك الذي أرسلت».","رواه البخاري ومسلم"],
["سنن قبل النوم","«اللهم رب السماوات السبع ورب العرش العظيم، ربنا ورب كل شيء، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شر كل شيء أنت آخذ بناصيته، اللهم أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء، وأنت الباطن فليس دونك شيء، اقض عنا الدين وأغننا من الفقر».","رواه مسلم"],
["سنن قبل النوم","قراءة آخر آيتين من سورة البقرة (من «آمن الرسول بما أنزل إليه من ربه» إلى آخر السورة): «من قرأ بهما في ليلة كفتاه».","رواه البخاري ومسلم"],
["سنن قبل النوم","أن يكون على طهارة: «إذا أتيت مضجعك فتوضأ».",""],
["سنن قبل النوم","النوم على الشق الأيمن، ووضع اليد اليمنى تحت الخد الأيمن.","رواه البخاري ومسلم وأبو داود"],
["سنن قبل النوم","نفض الفراش قبل النوم: «فإنه لا يعلم ما خلفه بعده».","رواه البخاري ومسلم"],
["سنن قبل النوم","قراءة سورة «قل يا أيها الكافرون»: فهي براءة من الشرك.","رواه أبو داود والترمذي وأحمد"],
["استحضار النية والذكر","استحضار النية الصالحة في كل عمل مباح (كالنوم والأكل وطلب الرزق) ليصير طاعة: «إنما الأعمال بالنيات وإنما لكل امرئ ما نوى».","رواه البخاري ومسلم"],
["استحضار النية والذكر","اغتنام الوقت الواحد في أكثر من عبادة، كالذكر أو قراءة القرآن أثناء الذهاب إلى المسجد.",""],
["استحضار النية والذكر","ذكر الله في كل الأحيان: «كان رسول الله ﷺ يذكر الله في كل أحيانه».","رواه مسلم"],
["استحضار النية والذكر","التفكر في نعم الله: «تفكروا في آلاء الله ولا تفكروا في الله».","رواه الطبراني وحسنه الألباني"],
["استحضار النية والذكر","من رأى مبتلى فقال: «الحمد لله الذي عافاني مما ابتلاك به وفضلني على كثير ممن خلق تفضيلًا» لم يصبه ذلك البلاء.","رواه الترمذي"],
["استحضار النية والذكر","ختم القرآن في كل شهر: صفحتان قبل كل صلاة أو بعدها. «اقرأ القرآن في كل شهر».","رواه أبو داود"]
];
var N=S.length,DAY=864e5,K="sunnah_v1",st={start:null,done:{},applied:{},bm:{}};
try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r);for(var k in o)st[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function mid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
if(!st.start){st.start=mid(new Date());save()}
var today=Math.max(0,Math.round((mid(new Date())-st.start)/DAY));
function $(i){return document.getElementById(i)}
function item(d){return S[d%N]}
function speak(t,cb){try{if(!window.speechSynthesis){alert("المتصفح ده مش بيدعم الصوت");return}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[«»]/g,""));u.lang="ar-SA";u.rate=.85;if(cb)u.onend=cb;speechSynthesis.speak(u)}catch(e){}}
function streak(){var c=0,d=today;if(!st.done[d])d--;while(d>=0&&st.done[d]){c++;d--}return c}
function cnt(o){return Object.keys(o).length}

function home(){
 var s=item(today);
 $("bab").textContent=s[0];$("text").textContent=s[1];$("src").textContent=s[2];
 var d=!!st.done[today];
 $("done").classList.toggle("off",d);
 $("done").textContent=d?"✓ تم الحفظ":"تم الحفظ";
 $("apply").classList.toggle("on",!!st.applied[today]);
 $("apply").textContent=st.applied[today]?"✔ طبقتها":"هل طبقت السنة على نفسك؟";
 $("bm").classList.toggle("on",!!st.bm[today]);
 $("sn").textContent=streak();
 var dow=new Date().getDay(),names=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],h="",n=0;
 for(var w=0;w<7;w++){var di=today-(dow-w),ok=di>=0&&di<=today&&st.done[di];if(ok)n++;h+="<span>"+names[w]+"<i>"+(ok?"✓":"")+"</i></span>"}
 $("days").innerHTML=h;
 var p=Math.round(n/7*100);
 $("fill").style.width=Math.max(p,22)+"%";
 $("ft").textContent="تم إنجاز "+n+" من 7 أيام";$("fp").textContent=p+"%";
}
$("listen").onclick=function(){speak(item(today)[1])};
$("done").onclick=function(){if(st.done[today])delete st.done[today];else st.done[today]=1;save();home()};
$("apply").onclick=function(){if(st.applied[today])delete st.applied[today];else st.applied[today]=1;save();home()};
$("bm").onclick=function(){if(st.bm[today])delete st.bm[today];else st.bm[today]=1;save();home()};

function row(s,sub){return '<div class="item"><div class="t">'+s[1]+'<small>'+sub+(s[2]?' · '+s[2]:'')+'</small></div><button data-t="'+s[1].replace(/"/g,"&quot;")+'" aria-label="سمع">🔊</button></div>'}
function wire(box){var b=box.querySelectorAll("button[data-t]");for(var i=0;i<b.length;i++)b[i].onclick=function(){speak(this.getAttribute("data-t"))}}
function cats(){
 var h="",last="";
 for(var i=0;i<N;i++){var s=S[i];if(s[0]!==last){h+="<h3>"+s[0]+"</h3>";last=s[0]}h+=row(s,"السنة "+(i+1))}
 $("catList").innerHTML=h;wire($("catList"));
}
var past=[];
function prog(){
 $("s1").textContent=cnt(st.done);$("s2").textContent=cnt(st.applied);$("s3").textContent=streak();
 var h="";past=[];
 for(var d=0;d<=today;d++){past.push(item(d)[1]);h+=row(item(d),"اليوم "+(d+1)+(st.done[d]?" ✓":""))}
 $("past").innerHTML=h;wire($("past"));
}
$("playAll").onclick=function(){var i=0;(function nx(){if(i<past.length)speak(past[i++],nx)})()};
function acc(){$("startDate").textContent=new Date(st.start).toLocaleDateString("ar-EG")}
$("reset").onclick=function(){if(confirm("هتمسحي التقدم وتبدأي من الأول؟")){st={start:mid(new Date()),done:{},applied:{},bm:{}};save();location.reload()}};

var tabs=document.querySelectorAll("nav button"),fn={home:home,cats:cats,prog:prog,acc:acc};
for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){
 var v=this.getAttribute("data-v");
 for(var j=0;j<tabs.length;j++){var t=tabs[j].getAttribute("data-v");$(t).hidden=t!==v;tabs[j].setAttribute("aria-selected",t===v)}
 try{speechSynthesis.cancel()}catch(e){}
 fn[v]();
};
home();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
